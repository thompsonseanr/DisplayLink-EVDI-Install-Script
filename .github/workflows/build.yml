name: DisplayLink Installer Pyinstaller Release Build

# Playwright drivers will have to be installed with this ENV for pyinstaller:
# PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
# Build with:
# pyinstaller --onefile --add-data "styles.tcss:." py_displaylink_synaptics_install.py

# https://github.com/pyenv/pyenv/issues/1911
# Pyenv Dockerfile ENV/Paths
# Set the root directory for pyenv
# ENV PYENV_ROOT="/root/.pyenv"

# Add pyenv binaries and shims to PATH
# ENV PATH="$PYENV_ROOT/shims:$PYENV_ROOT/bin:$PATH"

# Automatically initialize pyenv in bash/sh sessions
# RUN echo 'eval "$(pyenv init -)"' >> ~/.bashrc
# RUN echo 'eval "$(pyenv init --path)"' >> ~/.profile

# References:
# https://batsov.com/articles/2025/02/27/automate-the-creation-of-github-releases/
# https://cli.github.com/manual/gh_release_create
# https://github.com/NotCookey/Pyinstaller-Github-Actions
# https://github.com/pyenv/pyenv/issues/1911

# Trigger workflow with creation of 'v' tag
on:
  push:
    tags:
      - 'v*'

# Required permissions to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: 
          - ghcr.io/void-linux/void-glibc-full:latest
          - fedora:latest
          - registry.opensuse.org/opensuse/tumbleweed:latest
    container:
      image: ${{ matrix.distro }}
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    env:
      MAIN_PY_FILE: 'py_displaylink_synaptics_install.py'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: py-conversion

      - name: Set Github Action Vars
        run: |
          echo "PYENV_ROOT=$HOME/.pyenv" >> $GITHUB_ENV
          echo "$HOME/.pyenv/bin" >> $GITHUB_PATH
          echo "$HOME/.pyenv/shims" >> $GITHUB_PATH

      # Void Container
      - name: Set up Dependencies in Void
        if: matrix.distro == 'ghcr.io/void-linux/void-glibc-full:latest'
        run: |
          xbps-install -Syu && \
          xbps-install -y \
          python3 \
          python3-devel \
          base-devel \
          bash \
          binutils

      # Fedora Container
      - name: Set up Dependencies in Fedora
        if: matrix.distro == 'fedora.latest'
        run: | 
          dnf upgrade -y && \
          dnf install -y \
          git \
          make \
          gcc \
          zlib-devel \
          bzip2 \
          bzip2-devel \
          readline-devel \
          sqlite \
          sqlite-devel \
          openssl-devel \
          tk-devel \
          libffi-devel \
          xz-devel \
          findutils \
          && dnf clean all
          export PYENV_ROOT="/root/.pyenv"
          export PATH="${PYENV_ROOT}/shims:${PYENV_ROOT}/bin:${PATH}"
          curl -fsSL https://pyenv.run | bash
          eval "$(${PYENV_ROOT}/bin/pyenv init -)"
          pyenv install 3.14.8
          pyenv global 3.14.8

      # openSUSE Container
      - name: Set up Dependencies in openSUSE
        if: matrix.distro == 'registry.opensuse.org/opensuse/tumbleweed:latest'
        run: | 
          zypper refresh && zypper install -y \
          gcc \
          automake \
          bzip2 \
          libbz2-devel \
          xz \
          xz-devel \
          openssl-devel \
          ncurses-devel \
          readline-devel \
          zlib-devel \
          tk-devel \
          libffi-devel \
          sqlite3-devel \
          gdbm-devel \
          make \
          findutils \
          patch \
          git \
          tar \
          bash \
          && zypper clean -a
          export PYENV_ROOT="/root/.pyenv"
          export PATH="${PYENV_ROOT}/shims:${PYENV_ROOT}/bin:${PATH}"
          curl -fsSL https://pyenv.run | bash
          eval "$(${PYENV_ROOT}/bin/pyenv init -)"
          pyenv install 3.14.8
          pyenv global 3.14.8
            

      # All Containers
      # - name: Install pyenv
      #   run: |
      #     curl -fsSL https://pyenv.run | bash
      #     export PYENV_ROOT="/root/.pyenv"
      #     export PATH="${PYENV_ROOT}/bin:${PYENV_ROOT}/shims:${PATH}"
      #     eval "$(pyenv init -)"
      #     # eval "$(${PYENV_ROOT}/bin/pyenv init -)"
      #     # echo 'eval "$(pyenv init -)"' >> ~/.bashrc
      #     # echo 'eval "$(pyenv init --path)"' >> ~/.profile
      #     pyenv install 3.14.8
      #     pyenv global 3.14.8
      #     echo "PYENV_ROOT=$PYENV_ROOT" >> $GITHUB_ENV
      #     echo "$PYENV_ROOT/shims" >> $GITHUB_PATH
      #     echo "$PYENV_ROOT/bin" >> $GITHUB_PATH

      # - name: Setup Pyenv Initialization
      #   run: |
      #     export PYENV_ROOT="/root/.pyenv" && \
      #     export PATH="${PYENV_ROOT}/shims:${PYENV_ROOT}/bin:${PATH}" && \
      #     echo 'eval "$(pyenv init -)"' >> ~/.bashrc && \
      #     echo 'eval "$(pyenv init --path)"' >> ~/.profile

      # - name: Install Python 3.14.8
      #   run: |
      #     pyenv install 3.14.8

      # - name: Set Python 3.14.8
      #   run: |
      #     pyenv global 3.14.8

      - name: Ensure Pip
        shell: bash
        run: |
          python -m ensurepip --default-pip

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: | 
          playwright install chromium

      # Void Build
      - name: Build executable Void
        if: matrix.distro == 'ghcr.io/void-linux/void-glibc-full:latest'
        shell: bash
        run: |
          pyinstaller --onefile --add-data "styles.tcss:." --windowed -n PyDisplaylinkSynapticsInstall_Void ${{ env.MAIN_PY_FILE }}

      # Fedora Build
      - name: Build executable Fedora
        if: matrix.distro == 'fedora.latest'
        shell: bash
        run: |
          pyinstaller --onefile --add-data "styles.tcss:." --windowed -n PyDisplaylinkSynapticsInstall_Fedora ${{ env.MAIN_PY_FILE }}

      # openSUSE Build
      - name: Build executable Fedora
        if: matrix.distro == 'fedora.latest'
        shell: bash
        run: |
          pyinstaller --onefile --add-data "styles.tcss:." --windowed -n PyDisplaylinkSynapticsInstall_openSUSE ${{ env.MAIN_PY_FILE }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables
          path: py_displaylink_synaptics_install/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4
        with:
          ref: py-conversion

      - name: Download Built Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-executables
          path: ${{ github.workspace }}/release_files/

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            "${{ github.workspace }}/release_files/*" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --notes-file release_notes.md
