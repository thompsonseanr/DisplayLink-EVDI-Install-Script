name: DisplayLink Installer Pyinstaller Release Build

# Trigger workflow with creation of 'v' tag
on:
  push:
    tags:
      - 'v*'

# Playwright drivers will have to be installed with this ENV for pyinstaller:
# PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
# Build with:
# pyinstaller --onefile --add-data "styles.tcss:." py_displaylink_synaptics_install.py

# References:
# https://batsov.com/articles/2025/02/27/automate-the-creation-of-github-releases/
# https://cli.github.com/manual/gh_release_create
# https://github.com/NotCookey/Pyinstaller-Github-Actions

# Required permissions to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # container:
    #   image: fedora:latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    
    env:
      MAIN_PY_FILE: 'py_displaylink_synaptics_install.py'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fedora Latest Container
      # - name: Set up Python in Fedora
      #   run: |
      #     dnf install -y python3.14 python3.14-devel gcc gcc-c++

      # Void Container
      - name: Set up Python in Void
        run: |
          xbps-install -Syu && \
          xbps-install -y python3 python3-devel base-devel bash binutils

      # Fedora Latest Container
      # - name: Ensure Pip
      #   run: |
      #     python3.14 -m ensurepip --default-pip

      # Void Container
      - name: Ensure Pip
        run: |
          python -m ensurepip --default-pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: | 
          playwright install chromium

      - name: Build executable
        run: |
          pyinstaller --onefile --add-data "styles.tcss:." --windowed ${{ env.MAIN_PY_FILE }}

      - name: Upload Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables
          path: py_displaylink_synaptics_install/dist/py_displaylink_synaptics_install

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4

      - name: Download Built Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-executables
          path: ${{ github.workspace }}/release_files/

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            "${{ github.workspace }}/release_files/py_displaylink_synaptics_install" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --notes-file release_notes.md
