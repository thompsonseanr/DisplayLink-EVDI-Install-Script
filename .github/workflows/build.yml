name: DisplayLink Installer Pyinstaller Release Build

# References:
# https://batsov.com/articles/2025/02/27/automate-the-creation-of-github-releases/
# https://cli.github.com/manual/gh_release_create
# https://github.com/NotCookey/Pyinstaller-Github-Actions
# https://github.com/pyenv/pyenv/issues/1911

# Trigger workflow with creation of 'v' tag
on:
  push:
    tags:
      - 'v*'

# Required permissions to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: void
            dockerfile: docker/Dockerfile.void
            binary_name: PyDisplaylinkSynapticsInstall_Void
          - distro: arch
            dockerfile: docker/Dockerfile.arch
            binary_name: PyDisplaylinkSynapticsInstall_Arch
          - distro: fedora
            dockerfile: docker/Dockerfile.fedora
            binary_name: PyDisplaylinkSynapticsInstall_Fedora
          - distro: opensuse
            dockerfile: docker/Dockerfile.opensuse
            binary_name: PyDisplaylinkSynapticsInstall_Opensuse
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    env:
      MAIN_PY_FILE: 'py_displaylink_synaptics_install.py'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: py-conversion

      - name: Build Containers
        run: |
          docker build -f ${{ matrix.dockerfile }} -t pyenv-${{ matrix.distro }}:latest .

      - name: Run Docker image
        run: |
          docker run --rm \
          -v ${PWD}:/workspace \
          -w /workspace \
          pyenv-${{ matrix.distro }}:latest \
          /bin/bash

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: | 
          playwright install chromium

      - name: Build Pyinstaller Executable
        shell: bash
        run: |
          pyinstaller --onefile --add-data "styles.tcss:." --windowed -n ${{ matrix.binary_name }} ${{ env.MAIN_PY_FILE }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables-${{ matrix.distro }}
          path: py_displaylink_synaptics_install/dist/${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4
        with:
          ref: py-conversion

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: linux-executables-*
          path: ${{ github.workspace }}/release_files/
          merge-multiple: true

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            "${{ github.workspace }}/release_files/*" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --notes-file release_notes.md
