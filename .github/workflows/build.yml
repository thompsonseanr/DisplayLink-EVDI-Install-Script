name: DisplayLink Installer Pyinstaller Release Build

# References:
# https://batsov.com/articles/2025/02/27/automate-the-creation-of-github-releases/
# https://cli.github.com/manual/gh_release_create
# https://github.com/NotCookey/Pyinstaller-Github-Actions
# https://github.com/pyenv/pyenv/issues/1911

# Trigger workflow with creation of 'v' tag
on:
  push:
    tags:
      - 'v*'

# Required permissions to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: py-pip

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "py_displaylink_synaptics_install/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: uv sync

      - name: Install Playwright Chrome Browser
        run: uv run playwright install chrome

      - name: Build Wheel and Source Dist
        run: uv build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ./py_displaylink_synaptics_install/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4
        with:
          ref: py-pip

      - name: Download Built Wheel
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: ${{ github.workspace }}/release_files/

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            ${{ github.workspace }}/release_files/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --notes-file release_notes.md
