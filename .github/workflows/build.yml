name: DisplayLink Installer Pyinstaller Release Build

# Playwright drivers will have to be installed with this ENV for pyinstaller:
# PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
# Build with:
# pyinstaller --onefile --add-data "styles.tcss:." py_displaylink_synaptics_install.py

# References:
# https://batsov.com/articles/2025/02/27/automate-the-creation-of-github-releases/
# https://cli.github.com/manual/gh_release_create
# https://github.com/NotCookey/Pyinstaller-Github-Actions

# Trigger workflow with creation of 'v' tag
on:
  push:
    tags:
      - 'v*'

# Required permissions to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: 
          - ghcr.io/void-linux/void-glibc-full:latest
          - fedora:latest
          - registry.opensuse.org/opensuse/tumbleweed:latest
    container:
      image: ${{ matrix.distro }}
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    env:
      MAIN_PY_FILE: 'py_displaylink_synaptics_install.py'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Void Container
      - name: Set up Dependencies in Void
        run: |
          xbps-install -Syu && \
          xbps-install -y base-devel bzip2-devel gdbm-devel libffi-devel libuuid-devel openssl-devel readline-devel sqlite-devel tk-devel xz-devel zlib-devel

      # Fedora Container
      - name: Set up Dependencies in Fedora
        run: | 
          dnf upgrade && \
          dnf group install -y development-tools && \
          dnf install -y openssl-devel bzip2-devel libffi-devel xz-devel zlib-devel gdbm-devel readline-devel sqlite-devel tk-devel uuid-devel libuuid-devel

      # openSUSE Container
      - name: Set up Dependencies in openSUSE
        run: | 
          zypper refresh && \
          zypper install -t pattern devel_basis && \
          zypper install -y gcc automake bzip2 libbz2-devel xz xz-devel openssl-devel ncurses-devel readline-devel zlib-devel tk-devel libffi-devel sqlite3-devel libgdbm-devel make findutils patch libuuid-devel

      # All Containers
      - name: Install pyenv
        run: |
          curl -fsSL https://pyenv.run | bash

      - name: Install Python 3.14.8
        run: |
          pyenv install 3.14.8

      - name: Set Python 3.14.8
        run: |
          pyenv local 3.14.8

      - name: Ensure Pip
        run: |
          python -m ensurepip --default-pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: | 
          playwright install chromium

      - name: Build executable
        run: |
          pyinstaller --onefile --add-data "styles.tcss:." --windowed ${{ env.MAIN_PY_FILE }}

      - name: Upload Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables
          path: py_displaylink_synaptics_install/dist/py_displaylink_synaptics_install

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py_displaylink_synaptics_install
    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4

      - name: Download Built Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-executables
          path: ${{ github.workspace }}/release_files/

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            "${{ github.workspace }}/release_files/py_displaylink_synaptics_install" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --notes-file release_notes.md
