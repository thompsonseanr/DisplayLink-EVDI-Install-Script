[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py_displaylink_synaptics_install"
version = "1.1.4"
description = "Textual TUI for installing Synaptics DisplayLink and EVDI firmware for Linux."
readme = "README.md"
authors = [
    { name = "thompsonseanr" }
]
requires-python = ">=3.9"
dependencies = [
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.5",
    "aiohttp-jinja2>=1.6",
    "aiosignal>=1.4.0",
    "altgraph>=0.17.5",
    "ast-serialize>=0.13.1",
    "attrs>=26.1.0",
    "build>=1.6.1",
    "click>=8.5.0",
    "frozenlist>=1.8.0",
    "gitdb>=4.0.12",
    "gitpython>=3.2.1",
    "greenlet>=3.5.6",
    "idna>=3.20",
    "iniconfig>=2.3.1",
    "jinja2>=3.1.6",
    "librt>=0.16.0",
    "linkify-it-py>=2.2.0",
    "markdown-it-py[linkify]>=4.2.0",
    "markupsafe>=3.0.4",
    "mdit-py-plugins>=0.6.1",
    "mdurl>=0.1.2",
    "msgpack>=1.2.4",
    "multidict>=7.2.1",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "platformdirs>=4.14.3",
    "playwright>=1.64.1",
    "pluggy>=1.7.0",
    "propcache>=0.5.4",
    "pyee>=14.0.0",
    "pygments>=2.21.0",
    "pyproject-hooks>=1.3.3",
    "pytest>=9.2.0",
    "rich>=15.0.0",
    "smmap>=5.0.3",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "textual-serve>=1.1.3",
    "typing-extensions>=4.16.0",
    "yarl>=1.25.1",
]

[project.scripts]
py_displaylink_synaptics_install = "py_displaylink_synaptics_install.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_displaylink_synaptics_install"]
artifacts = ["src/py_displaylink_synaptics_install/*.tcss"]
