[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_displaylink_synaptics_install"
version = "1.1.4"
description = "Textual TUI for installing Synaptics DisplayLink and EVDI firmware for Linux."
readme = "README.md"
requires-python = ">=3.9"

# Dynamic dependencies
dynamic = ["dependencies"]

# Use requirements.txt
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
py_displaylink_synaptics_install = "py_displaylink_synaptics_install.main:main"

[tool.poetry.scripts]
py_displaylink_synaptics_install = "py_displaylink_synaptics_install.main:main"
